name: Verify Faultline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test CXX=${{ matrix.compiler }}
      - name: Verify generated demo is current
        run: |
          make demo
          git diff --exit-code -- web/demo.js
      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: faultline-${{ matrix.compiler }}
          path: build/faultline
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make sanitize
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
